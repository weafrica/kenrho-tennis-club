<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Membership register — KenRho Park Tennis Club</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/kr-favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/kr-apple-180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#1f3d1a" />
<link rel="stylesheet" href="css/styles.css" />
<style>
  .reg { --pine:#1f3d1a; --grass:#3c7a2e; --lime:#d6f08a; --line:#dfe6d3; max-width:1240px; margin:0 auto; padding:0 16px 40px; }
  .reg h1 { margin:6px 0 2px; font-size:1.7rem; } .reg .sub { color:#5d6b57; margin:0 0 14px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .st { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; } .st .k { font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:#6b7a63; } .st .v { font-size:1.35rem; font-weight:800; margin-top:2px; } .st .s { font-size:.74rem; color:#6b7a63; }
  .bar { height:8px; border-radius:99px; background:#e6edd9; overflow:hidden; margin-top:6px; } .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--grass),#7bc043); }
  .bar2 { height:6px; width:100%; min-width:80px; }
  .tb { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px; } .tb input[type=search] { flex:1; min-width:220px; padding:10px 14px; border:1.5px solid var(--line); border-radius:99px; font:inherit; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; } .chip { border:1px solid var(--line); background:#fff; border-radius:99px; padding:6px 13px; font:inherit; font-size:.82rem; font-weight:600; cursor:pointer; color:#3a4a33; } .chip.on { background:var(--pine); color:#fff; border-color:var(--pine); } .chip small { opacity:.65; margin-left:3px; }
  table.rg { width:100%; border-collapse:separate; border-spacing:0; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:.9rem; }
  table.rg th { text-align:left; background:#eef6d9; padding:10px 12px; font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:#41533a; position:sticky; top:0; }
  table.rg td { padding:10px 12px; border-top:1px solid #eef1e6; vertical-align:middle; } table.rg tr.m { cursor:pointer; } table.rg tr.m:hover td { background:#f8fbf1; }
  .nm b { display:block; } .nm small { color:#7a8873; font-size:.72rem; } .tp { display:inline-block; font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:99px; background:#e8f1d6; color:#2f5a22; }
  .pill { display:inline-block; font-size:.74rem; font-weight:800; padding:4px 10px; border-radius:99px; white-space:nowrap; } .p-ok { background:#e2f4d4; color:#2a6a1f; } .p-owe { background:#fdeadf; color:#b4531a; } .p-cr { background:#e3eefc; color:#1f5fa8; } .p-na { background:#eee; color:#777; }
  .ck { display:inline-flex; gap:4px; } .ck span { width:22px; height:22px; border-radius:6px; font-size:.68rem; font-weight:800; display:inline-flex; align-items:center; justify-content:center; } .ck .y { background:#e2f4d4; color:#2a6a1f; } .ck .n { background:#fdeadf; color:#b4531a; }
  .dr-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:70; display:flex; justify-content:flex-end; }
  .dr { background:#fbfcf7; width:min(480px,100%); height:100%; overflow:auto; padding:18px; box-shadow:-10px 0 30px rgba(0,0,0,.2); }
  .dr h2 { margin:0; } .dr .sec { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:12px 0; } .dr .sec h4 { margin:0 0 6px; font-size:.78rem; text-transform:uppercase; letter-spacing:.07em; color:#5d6b57; }
  .dr label { display:block; font-size:.76rem; color:#5d6b57; margin:9px 0 3px; } .dr input[type=text],.dr input[type=email],.dr input[type=tel],.dr input[type=number],.dr input[type=date],.dr select,.dr textarea { width:100%; padding:9px 10px; border:1.5px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
  .g2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .acts { display:flex; gap:8px; flex-wrap:wrap; } .tog { display:flex; align-items:center; gap:8px; margin:8px 0; } .tog input { width:auto; }
  .flag { background:#fff6e0; border:1px solid #f0d28a; border-radius:8px; padding:8px 10px; font-size:.8rem; margin-top:8px; }
  .saved { font-size:.74rem; color:#2a6a1f; min-height:1em; }
  @media (max-width:760px){ table.rg .hide-s { display:none; } }
</style>
</head>
<body class="app-shell">
<div class="app-nav">
  <div class="wrap">
    <a class="nav-brand" href="index.html"><img src="assets/logo-mark.png" alt="" /><span>KenRho Park &middot; Admin</span></a>
    <div class="flex gap-16"><span class="muted small" id="who">—</span><a href="admin.html" class="btn btn-outline-light btn-sm">&larr; Back to admin</a><button id="btn-sign-out" class="btn btn-outline-light btn-sm">Sign out</button></div>
  </div>
  <div class="wrap tabs mt-16"><a href="admin.html">Members</a><a class="active">Membership register</a><a href="admin-documents.html">Invoices &amp; receipts</a><a href="members-list.html">Member list</a></div>
</div>
<main class="app-main"><div class="reg">
  <div class="flex-between" style="flex-wrap:wrap;gap:10px"><div><h1>Membership register <span style="font-weight:500;color:#6b7a63">2026</span></h1><p class="sub">The treasurer's sheet, made easy. Tap anyone to see or change their details.</p></div>
    <div class="acts"><select id="season" title="Season" style="padding:9px 12px;border:1.5px solid #dfe6d3;border-radius:99px;font:inherit;font-weight:700;background:#fff"></select><button class="btn btn-outline hidden" id="btn-newseason">Start new season</button><button class="btn btn-primary" id="btn-add">+ Add member</button><button class="btn btn-outline" id="btn-csv">Export</button><button class="btn btn-outline" id="btn-import">📥 Import / compare</button><button class="btn btn-outline" id="btn-sync">🔗 Google Sheet sync</button><a class="btn btn-outline" target="_blank" rel="noopener" href="https://docs.google.com/spreadsheets/d/1ugiOvbj0WnqZ-TX-yCCaz4t1NoKtpSwadNVaPl1cpxY/edit">Open Google Sheet ↗</a></div></div>
  <div id="season-note" class="flag hidden" style="margin-bottom:10px"></div><div class="stats" id="stats"></div>
  <div class="tb"><input type="search" id="q" placeholder="Search name, email, phone or member number…"></div>
  <div class="chips" id="chips"></div>
  <div style="overflow:auto"><table class="rg"><thead><tr><th>Member</th><th class="hide-s">Contact</th><th>Paid this year</th><th>Status</th><th class="hide-s">Form · Proof</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="muted" style="padding:24px">Loading…</td></tr></tbody></table></div>
</div></main>

<script src="js/statement.js"></script>

<script src="js/register-import.js"></script>
<script src="js/pwa.js"></script>

</body>
</html>
